<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#143761"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners (iOS/Android mask will override, but looks good standalone) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Stylised receipt -->
  <g filter="url(#shadow)" transform="translate(260 200)">
    <!-- Paper -->
    <path d="M0 0 H504 V560 L470 600 L436 560 L402 600 L368 560 L334 600 L300 560 L266 600 L232 560 L198 600 L164 560 L130 600 L96 560 L62 600 L28 560 L0 600 Z"
          fill="#ffffff"/>
    <!-- Top accent bar -->
    <rect x="0" y="0" width="504" height="56" fill="#c6a35a"/>
    <!-- Check mark circle -->
    <circle cx="400" cy="170" r="52" fill="#16a34a"/>
    <path d="M376 172 l18 18 l36 -42" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lines of text -->
    <rect x="40" y="130" width="280" height="18" rx="4" fill="#0b1f3a" opacity="0.85"/>
    <rect x="40" y="180" width="220" height="14" rx="4" fill="#0b1f3a" opacity="0.55"/>
    <rect x="40" y="250" width="424" height="10" rx="3" fill="#0b1f3a" opacity="0.25"/>
    <rect x="40" y="290" width="380" height="10" rx="3" fill="#0b1f3a" opacity="0.25"/>
    <rect x="40" y="330" width="400" height="10" rx="3" fill="#0b1f3a" opacity="0.25"/>
    <rect x="40" y="370" width="340" height="10" rx="3" fill="#0b1f3a" opacity="0.25"/>
    <!-- Total line -->
    <rect x="40" y="430" width="424" height="2" fill="#0b1f3a" opacity="0.5"/>
    <rect x="40" y="450" width="140" height="18" rx="4" fill="#0b1f3a"/>
    <rect x="320" y="448" width="144" height="22" rx="4" fill="#c6a35a"/>
  </g>
</svg>
